name: Review Compass
description: Score a pull request for review risk and tell reviewers where to look first.
author: Paul1451

inputs:
  anthropic-api-key:
    description: Optional Anthropic API key. Without it the intent check shows "not run".
    required: false
    default: ""
  github-token:
    description: Token used to post the comment, label and review.
    required: false
    default: ${{ github.token }}
  bot-login:
    description: Login of the account that posts the comment and review (default github-actions[bot]).
    required: false
    default: ""

runs:
  using: composite
  steps:
    # setup-uv is pinned by commit SHA (v10.3.3); the package itself is installed from uv.lock.
    # Without `version` and `cache-dependency-glob` setup-uv looks for pyproject.toml / uv.lock in
    # the calling repository: it then warns on every run of a non-Python repository and falls
    # back to the latest uv. Both inputs point it at this action instead.
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: "0.13.9"
        cache-dependency-glob: ${{ github.action_path }}/uv.lock
    - name: Install Review Compass from uv.lock
      shell: bash
      run: uv sync --locked --no-dev --project "$GITHUB_ACTION_PATH"
      env:
        # Explicit, so a UV_PROJECT_ENVIRONMENT set by the calling workflow cannot move it.
        UV_PROJECT_ENVIRONMENT: ${{ github.action_path }}/.venv
    - name: Run Review Compass
      shell: bash
      run: '"$GITHUB_ACTION_PATH/.venv/bin/review-compass" pr'
      env:
        UV_PROJECT_ENVIRONMENT: ${{ github.action_path }}/.venv
        GITHUB_TOKEN: ${{ inputs.github-token }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        REVIEW_COMPASS_BOT_LOGIN: ${{ inputs.bot-login }}
