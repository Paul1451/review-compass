[project]
name = "review-compass"
version = "0.1.0"
description = "Score pull requests for review risk and tell reviewers where to look first."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "pyyaml",
    "pathspec",
    "httpx",
    "anthropic",
]

[project.scripts]
review-compass = "review_compass.cli:main"

[dependency-groups]
dev = ["pytest", "ruff", "mypy", "types-PyYAML"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/review_compass"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
